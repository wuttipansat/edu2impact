openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /races:
    post:
      operationId: createRace
      tags: [races]
      summary: Open a freshwater boat race room
      responses:
        "201":
          description: Room and private host capability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaceCreated"
  /races/{code}:
    get:
      operationId: getRace
      tags: [races]
      summary: Get the shared race state
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, pattern: "^[A-F0-9]{10}$" }
      responses:
        "200":
          description: Room state including every boat's current result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaceRoom"
        "404":
          description: Room not found
  /races/{code}/boats:
    post:
      operationId: submitRaceBoat
      tags: [races]
      summary: Submit or update your boat before the race begins
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, pattern: "^[A-F0-9]{10}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RaceSubmission"
      responses:
        "201":
          description: Accepted boat and private participant capability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaceSubmitted"
        "400":
          description: Invalid boat design
        "403":
          description: Participant token does not match
        "409":
          description: Room has started or is full
  /races/{code}/start:
    post:
      operationId: startRace
      tags: [races]
      summary: Start a race with two or more boats
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, pattern: "^[A-F0-9]{10}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RaceStartInput"
      responses:
        "200":
          description: Running race
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaceRoom"
        "403":
          description: Not the room host
        "409":
          description: Already started or needs at least two boats
  /races/{code}/boats/{boatId}/review:
    get:
      operationId: getRaceBoatReview
      tags: [races]
      summary: Read a finished boat's immutable design, submitted experiment history, and anonymous discussion
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, pattern: "^[A-F0-9]{10}$" }
        - name: boatId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Review and comments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaceBoatReview"
        "403":
          description: Reviews open only after the race
        "404":
          description: Room or boat not found
  /races/{code}/boats/{boatId}/comments:
    post:
      operationId: postRaceBoatComment
      tags: [races]
      summary: Add an anonymous comment or reply after a race
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, pattern: "^[A-F0-9]{10}$" }
        - name: boatId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RaceCommentInput"
      responses:
        "201":
          description: Comment saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaceComment"
        "400":
          description: Invalid comment or parent
        "403":
          description: Discussion opens only after the race
        "404":
          description: Room or boat not found
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    RaceMaterialMix:
      type: object
      required: [material, share]
      properties:
        material: { type: string, enum: [wood, aluminum, plastic, steel, paper] }
        share: { type: number, minimum: 0, maximum: 100 }
    RacePart:
      type: object
      required: [id, material, scale]
      properties:
        id: { type: string, enum: [keel, deck, cabin, outriggers, flotation, mast, rudder] }
        material: { type: string, enum: [wood, aluminum, plastic, steel, paper] }
        scale: { type: number, minimum: 0.5, maximum: 1.5 }
        quantity: { type: integer, minimum: 1, maximum: 4 }
    RaceBoatDesign:
      type: object
      required: [materialMix, parts, shape, length, width, height, thickness]
      properties:
        materialMix:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: "#/components/schemas/RaceMaterialMix" }
        parts:
          type: array
          maxItems: 7
          items: { $ref: "#/components/schemas/RacePart" }
        shape: { type: string, enum: [tray, box, canoe, cylinder, barge, catamaran, pontoon, triangular] }
        length: { type: number, exclusiveMinimum: 0, maximum: 120 }
        width: { type: number, exclusiveMinimum: 0, maximum: 80 }
        height: { type: number, exclusiveMinimum: 0, maximum: 60 }
        thickness: { type: number, exclusiveMinimum: 0, maximum: 10 }
    RaceBoatAppearance:
      type: object
      description: Public visual representation with deliberately approximate proportions; the editable design remains private until the race finishes.
      required: [shape, material, lengthScale, heightScale, beamScale, wallScale, parts]
      properties:
        shape: { type: string, enum: [tray, box, canoe, cylinder, barge, catamaran, pontoon, triangular] }
        material: { type: string, enum: [wood, aluminum, plastic, steel, paper] }
        lengthScale: { type: number, minimum: 0.55, maximum: 1.65 }
        heightScale: { type: number, minimum: 0.6, maximum: 1.6 }
        beamScale: { type: number, minimum: 0.55, maximum: 1.8 }
        wallScale: { type: number, minimum: 0.65, maximum: 3 }
        parts:
          type: array
          maxItems: 7
          items: { $ref: "#/components/schemas/RacePart" }
    RaceSubmission:
      type: object
      required: [name, design]
      properties:
        name: { type: string, minLength: 1, maxLength: 32 }
        design: { $ref: "#/components/schemas/RaceBoatDesign" }
        participantToken: { type: string }
        experiments:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/RaceExperiment" }
    RaceExperiment:
      type: object
      required: [recordedAt, liquid, aboveWaterWeight, underwaterWeight, displacedLiquidWeight, totalDensity, liquidDensity, submergedPercent]
      properties:
        recordedAt: { type: string, maxLength: 40 }
        liquid: { type: string, enum: [freshwater, seawater, vegetable-oil, machine-oil, alcohol, glycerin, syrup, honey, mercury] }
        aboveWaterWeight: { type: number, minimum: 0, maximum: 10000000 }
        underwaterWeight: { type: number, minimum: 0, maximum: 10000000 }
        displacedLiquidWeight: { type: number, minimum: 0, maximum: 10000000 }
        totalDensity: { type: number, minimum: 0, maximum: 10000000 }
        liquidDensity: { type: number, minimum: 0, maximum: 10000000 }
        submergedPercent: { type: number, minimum: 0, maximum: 100 }
    RaceStartInput:
      type: object
      required: [hostToken]
      properties:
        hostToken: { type: string, minLength: 20 }
    RaceBoat:
      type: object
      required: [id, name, shape, appearance, boatMass, effectiveVolume, capacityMass, innerCapacityMass, sinkStep, submergedPercent, status]
      properties:
        id: { type: string }
        name: { type: string }
        shape: { type: string, enum: [tray, box, canoe, cylinder, barge, catamaran, pontoon, triangular] }
        appearance: { $ref: "#/components/schemas/RaceBoatAppearance" }
        design: { $ref: "#/components/schemas/RaceBoatDesign" }
        boatMass: { type: number }
        effectiveVolume: { type: number }
        capacityMass: { type: number }
        innerCapacityMass: { type: number }
        sinkStep: { type: integer }
        submergedPercent: { type: number }
        status: { type: string, enum: [float, overflow, sink] }
    RaceRoom:
      type: object
      required: [code, phase, massStep, step, maxSteps, winnerIds, boats]
      properties:
        code: { type: string }
        phase: { type: string, enum: [waiting, running, finished] }
        massStep: { type: number }
        step: { type: integer }
        maxSteps: { type: integer }
        winnerIds:
          type: array
          items: { type: string }
        boats:
          type: array
          items: { $ref: "#/components/schemas/RaceBoat" }
    RaceCreated:
      type: object
      required: [room, hostToken]
      properties:
        room: { $ref: "#/components/schemas/RaceRoom" }
        hostToken: { type: string }
    RaceSubmitted:
      type: object
      required: [room, participantToken, boatId]
      properties:
        room: { $ref: "#/components/schemas/RaceRoom" }
        participantToken: { type: string }
        boatId: { type: string }
    RaceCommentInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 500 }
        parentId: { type: string, format: uuid }
        participantToken: { type: string }
        hostToken: { type: string }
    RaceComment:
      type: object
      required: [id, body, createdAt]
      properties:
        id: { type: string, format: uuid }
        parentId: { type: ["string", "null"], format: uuid }
        body: { type: string }
        createdAt: { type: string, format: date-time }
    RaceBoatReview:
      type: object
      required: [boatId, name, design, experiments, comments]
      properties:
        boatId: { type: string, format: uuid }
        name: { type: string }
        design: { $ref: "#/components/schemas/RaceBoatDesign" }
        experiments:
          type: array
          items: { $ref: "#/components/schemas/RaceExperiment" }
        comments:
          type: array
          items: { $ref: "#/components/schemas/RaceComment" }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

